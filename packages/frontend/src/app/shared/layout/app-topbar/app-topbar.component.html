<header
  class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur-xl dark:border-slate-800 dark:bg-slate-950/85"
>
  <div class="flex min-h-[var(--spacing-app-header)] flex-wrap items-center gap-3 px-4 py-3 sm:px-6 lg:px-8">
    <liass-button
      class="lg:hidden"
      size="icon"
      variant="outline"
      tone="neutral"
      [ariaLabel]="'SHELL.TOPBAR.TOGGLE_NAVIGATION' | transloco"
      [icon]="uiStore.sidebarOpen() ? 'close' : 'menu'"
      (pressed)="uiStore.toggleSidebar()"
    />

    <div class="min-w-0 flex-1">
      <p class="text-xs font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">
        {{ 'SHELL.TOPBAR.WORKSPACE' | transloco }}
      </p>
      <h2 class="truncate text-base font-semibold text-slate-950 dark:text-white">
        {{ sectionTitleKey() | transloco }}
      </h2>
    </div>

    <div class="hidden w-full max-w-[360px] md:block">
      <liass-command-input
        [placeholder]="'SHELL.TOPBAR.COMMAND_PLACEHOLDER' | transloco"
        [value]="commandValue"
        (valueChange)="updateCommandValue($event)"
      />
    </div>

    <div class="hidden items-center gap-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm font-medium text-slate-600 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-300 sm:flex">
      <mat-icon class="text-brand-700 dark:text-brand-300">domain</mat-icon>
      <span class="max-w-[180px] truncate">{{ authStore.activeOrgId() || ('SHELL.TOPBAR.NO_ORG' | transloco) }}</span>
    </div>

    <liass-button
      size="icon"
      variant="outline"
      tone="neutral"
      [ariaLabel]="uiStore.themeMode() === 'dark' ? ('SHELL.TOPBAR.LIGHT_MODE' | transloco) : ('SHELL.TOPBAR.DARK_MODE' | transloco)"
      [icon]="uiStore.themeMode() === 'dark' ? 'light_mode' : 'dark_mode'"
      (pressed)="uiStore.toggleThemeMode()"
    />

    <liass-language-selector />

    <liass-dropdown [open]="userMenuOpen" width="md" align="end" (closed)="userMenuOpen = false">
      <button
        liassDropdownTrigger
        class="flex h-10 items-center gap-2 rounded-lg border border-slate-200 bg-white px-2.5 text-sm font-semibold text-slate-700 shadow-sm shadow-slate-900/[0.03] transition hover:bg-slate-50 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800"
        type="button"
        [attr.aria-label]="'SHELL.TOPBAR.USER_MENU' | transloco"
        (click)="toggleUserMenu()"
      >
        <span class="grid size-7 place-items-center rounded-full bg-brand-100 text-brand-700 dark:bg-brand-900/45 dark:text-brand-300">
          <mat-icon>person</mat-icon>
        </span>
        <span class="hidden max-w-[150px] truncate md:inline">
          {{ userLabel() || ('SHELL.TOPBAR.USER' | transloco) }}
        </span>
        <mat-icon class="text-slate-400">{{ userMenuOpen ? 'expand_less' : 'expand_more' }}</mat-icon>
      </button>

      <div class="border-b border-slate-100 pb-3 dark:border-slate-800">
        <p class="text-sm font-semibold text-slate-950 dark:text-white">
          {{ userLabel() || ('SHELL.TOPBAR.USER' | transloco) }}
        </p>
        <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">
          {{ authStore.activeOrgId() || ('SHELL.TOPBAR.NO_ORG' | transloco) }}
        </p>
      </div>

      <button
        class="mt-2 flex w-full items-center gap-3 rounded-app-control px-3 py-2 text-left text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-slate-950 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white"
        type="button"
        role="menuitem"
        (click)="logout()"
      >
        <mat-icon>logout</mat-icon>
        <span>{{ 'SHELL.TOPBAR.SIGN_OUT' | transloco }}</span>
      </button>
    </liass-dropdown>
  </div>
</header>
