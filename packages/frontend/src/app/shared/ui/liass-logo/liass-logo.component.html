<span [class]="containerClass()">
  @if (hasImageError()) {
    <span class="truncate text-sm font-semibold text-brand-700 dark:text-brand-300">
      {{ fallbackText() }}
    </span>
  } @else if (theme() === 'auto') {
    <img
      [class]="imageClass() + ' dark:hidden'"
      [src]="lightBackgroundAsset().source"
      [alt]="alt()"
      [width]="lightBackgroundAsset().width"
      [height]="lightBackgroundAsset().height"
      decoding="async"
      (error)="handleImageError()"
    />
    <img
      [class]="imageClass() + ' hidden dark:block'"
      [src]="darkBackgroundAsset().source"
      [alt]="alt()"
      [width]="darkBackgroundAsset().width"
      [height]="darkBackgroundAsset().height"
      decoding="async"
      (error)="handleImageError()"
    />
  } @else {
    <img
      [class]="imageClass()"
      [src]="selectedAsset().source"
      [alt]="alt()"
      [width]="selectedAsset().width"
      [height]="selectedAsset().height"
      decoding="async"
      (error)="handleImageError()"
    />
  }
</span>
