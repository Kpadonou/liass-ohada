<button
  [class]="buttonClass()"
  [type]="buttonType()"
  [disabled]="isDisabled()"
  [attr.aria-label]="ariaLabel()"
  (click)="emitPressed()"
>
  @if (loading()) {
    <span class="size-4 animate-spin rounded-full border-2 border-current border-r-transparent" aria-hidden="true"></span>
  } @else if (icon()) {
    <mat-icon>{{ icon() }}</mat-icon>
  }
  @if (size() !== 'icon') {
    <span class="truncate"><ng-content /></span>
  }
</button>
