<label [class]="inputClass()">
  <mat-icon class="shrink-0 text-app-muted">{{ leadingIcon() }}</mat-icon>
  <input
    class="min-w-0 flex-1 bg-transparent text-sm text-app-input-text outline-none placeholder:text-app-input-placeholder disabled:cursor-not-allowed disabled:text-app-text-disabled"
    type="search"
    autocomplete="off"
    [disabled]="disabled()"
    [placeholder]="placeholder()"
    [value]="value()"
    (input)="handleInput($event)"
    (keydown.enter)="submit()"
  />
  <span class="hidden rounded-app-sm border border-app-border bg-app-surface-muted px-1.5 py-0.5 text-[11px] font-semibold text-app-muted sm:inline">
    /
  </span>
</label>
