<label [class]="inputClass()">
  <mat-icon class="shrink-0 text-slate-400">{{ leadingIcon() }}</mat-icon>
  <input
    class="min-w-0 flex-1 bg-transparent text-sm outline-none placeholder:text-slate-400 disabled:cursor-not-allowed"
    type="search"
    autocomplete="off"
    [disabled]="disabled()"
    [placeholder]="placeholder()"
    [value]="value()"
    (input)="handleInput($event)"
    (keydown.enter)="submit()"
  />
  <span class="hidden rounded-app-sm border border-slate-200 bg-slate-50 px-1.5 py-0.5 text-[11px] font-semibold text-slate-400 dark:border-slate-800 dark:bg-slate-950 sm:inline">
    /
  </span>
</label>
