<div class="min-h-dvh bg-slate-50 text-slate-950">
  <header
    class="sticky top-0 z-30 border-b border-slate-200 bg-white/85 shadow-sm shadow-slate-900/[0.03] backdrop-blur-md"
  >
    <div class="mx-auto flex h-16 w-full max-w-7xl items-center gap-4 px-4 sm:px-6 lg:px-8">
      <a
        class="flex min-w-0 items-center gap-3 text-slate-950 no-underline"
        routerLink="/dashboard"
      >
        <span class="grid size-9 shrink-0 place-items-center rounded-md bg-emerald-700 text-white">
          <mat-icon>account_balance</mat-icon>
        </span>
        <span class="truncate text-base font-semibold">
          {{ 'COMMON.APP.BRAND' | transloco }}
        </span>
      </a>

      <span
        class="hidden rounded-md border border-slate-200 bg-slate-50 px-2.5 py-1 text-xs font-medium text-slate-600 sm:inline-flex"
      >
        {{ 'COMMON.APP.SHELL_LABEL' | transloco }}
      </span>

      <span class="flex-1"></span>

      <liass-language-selector />
    </div>
  </header>

  <main class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
    <router-outlet />
  </main>
</div>
