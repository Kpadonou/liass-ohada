<article
  class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm shadow-slate-900/[0.03] dark:border-slate-800 dark:bg-slate-900/80"
>
  <div class="flex items-start justify-between gap-4">
    <div [class]="iconClass()">
      <mat-icon>{{ icon() }}</mat-icon>
    </div>
    @if (trendLabel()) {
      <liass-status-chip [label]="trendLabel() ?? ''" [tone]="trendTone()" />
    }
  </div>

  <div class="mt-5">
    <p class="text-sm font-medium text-slate-500 dark:text-slate-400">{{ label() }}</p>
    <p class="mt-2 text-2xl font-semibold leading-tight text-slate-950 dark:text-white">{{ value() }}</p>
    <p class="mt-2 text-sm leading-6 text-slate-500 dark:text-slate-400">{{ meta() }}</p>
  </div>
</article>
