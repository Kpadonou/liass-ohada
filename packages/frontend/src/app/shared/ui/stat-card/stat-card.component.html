<article
  class="flex min-h-[178px] flex-col rounded-app-card border border-app-border bg-app-surface p-5 shadow-app-card"
>
  <div class="flex items-start justify-between gap-4">
    @if (state() === 'loading') {
      <liass-skeleton variant="circle" />
      <div class="w-16">
        <liass-skeleton variant="text" />
      </div>
    } @else {
      <div [class]="iconClass()">
        <mat-icon>{{ icon() }}</mat-icon>
      </div>
      @if (trendLabel()) {
        <liass-status-chip [label]="trendLabel() ?? ''" [tone]="trendTone()" size="sm" />
      }
    }
  </div>

  <div class="mt-5 flex-1">
    @if (state() === 'loading') {
      <liass-skeleton variant="text" />
      <div class="mt-3 w-2/3">
        <liass-skeleton variant="text" />
      </div>
      <div class="mt-3">
        <liass-skeleton variant="text" [lines]="2" />
      </div>
    } @else {
      <p class="text-sm font-medium text-app-muted">{{ label() }}</p>
      <p class="mt-2 break-words text-app-kpi font-semibold text-app-text">{{ value() }}</p>
      <p class="mt-2 text-sm leading-6 text-app-muted">{{ meta() }}</p>
    }
  </div>
</article>
