<button
  [class]="itemClass()"
  type="button"
  [disabled]="disabled()"
  [attr.aria-label]="label()"
  [matTooltip]="compact() ? label() : ''"
  matTooltipPosition="right"
  (click)="selectItem()"
>
  <span class="grid size-8 shrink-0 place-items-center rounded-app-control bg-white/80 text-current shadow-app-xs ring-1 ring-slate-200/70 transition group-hover:ring-slate-300 dark:bg-slate-900/80 dark:ring-slate-800 dark:group-hover:ring-slate-700">
    <mat-icon>{{ icon() }}</mat-icon>
  </span>
  <span [class]="compact() ? 'min-w-0 flex-1 truncate lg:sr-only' : 'min-w-0 flex-1 truncate'">{{ label() }}</span>
  @if (badge() && !compact()) {
    <span class="rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-semibold text-slate-500 dark:bg-slate-800 dark:text-slate-300">
      {{ badge() }}
    </span>
  } @else if (badge()) {
    <span class="rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-semibold text-slate-500 dark:bg-slate-800 dark:text-slate-300 lg:hidden">
      {{ badge() }}
    </span>
    <span
      class="absolute right-1.5 top-1.5 hidden size-2 rounded-full bg-brand-500 ring-2 ring-white dark:ring-slate-900 lg:block"
      aria-hidden="true"
    ></span>
  }
</button>
