<section
  class="rounded-app-card border border-app-border bg-app-surface shadow-app-card"
>
  <div class="flex flex-col gap-3 border-b border-app-border px-5 py-4 sm:flex-row sm:items-start sm:justify-between">
    <div class="min-w-0">
      <h2 class="text-app-card-title font-semibold text-app-text">{{ title() }}</h2>
      @if (description()) {
        <p class="mt-1 text-app-body text-app-muted">{{ description() }}</p>
      }
    </div>
    <ng-content select="[liassSectionActions]" />
  </div>
  <div [class]="bodyClass()">
    @if (state() === 'loading') {
      <div class="space-y-4">
        <liass-skeleton variant="text" [lines]="2" />
        <liass-skeleton variant="block" />
      </div>
    } @else if (state() === 'empty') {
      <div class="rounded-app-card border border-dashed border-app-border bg-app-surface-muted p-6 text-center">
        @if (emptyTitle()) {
          <p class="text-sm font-semibold text-app-text">{{ emptyTitle() }}</p>
        }
        @if (emptyDescription()) {
          <p class="mt-1 text-sm leading-6 text-app-muted">{{ emptyDescription() }}</p>
        }
      </div>
    } @else {
      <ng-content />
    }
  </div>
</section>
