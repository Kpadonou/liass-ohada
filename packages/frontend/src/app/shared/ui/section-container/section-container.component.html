<section
  class="rounded-lg border border-slate-200 bg-white shadow-sm shadow-slate-900/[0.03] dark:border-slate-800 dark:bg-slate-900/80"
>
  <div class="flex flex-col gap-3 border-b border-slate-100 px-5 py-4 dark:border-slate-800 sm:flex-row sm:items-start sm:justify-between">
    <div class="min-w-0">
      <h2 class="text-base font-semibold text-slate-950 dark:text-white">{{ title() }}</h2>
      @if (description()) {
        <p class="mt-1 text-sm leading-6 text-slate-500 dark:text-slate-400">{{ description() }}</p>
      }
    </div>
    <ng-content select="[liassSectionActions]" />
  </div>
  <div class="p-5">
    <ng-content />
  </div>
</section>
