<header class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
  <div class="min-w-0">
    <p class="text-app-eyebrow font-semibold uppercase tracking-[0.18em] text-brand-700 dark:text-brand-300">
      {{ eyebrow() }}
    </p>
    <h1 class="mt-2 text-2xl font-semibold leading-tight text-app-text dark:text-white md:text-app-page-title">
      {{ title() }}
    </h1>
    <p class="mt-2 max-w-3xl text-app-body text-slate-600 dark:text-slate-400">
      {{ subtitle() }}
    </p>
  </div>

  @if (actionLabel()) {
    <liass-button
      size="lg"
      tone="brand"
      variant="solid"
      [icon]="actionIcon()"
      (pressed)="emitAction()"
    >
      {{ actionLabel() }}
    </liass-button>
  }
</header>
