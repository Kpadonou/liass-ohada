<header class="border-b border-app-border/75 pb-3">
  <div class="flex flex-col gap-2.5 md:flex-row md:items-start md:justify-between">
    <div class="min-w-0">
      @if (eyebrow()) {
        <p class="text-xs font-semibold uppercase tracking-[0.14em] text-app-text-secondary">
          {{ eyebrow() }}
        </p>
      }
      <h1 class="mt-1 text-lg font-semibold leading-tight text-app-text md:text-app-page-title">
        {{ title() }}
      </h1>
      <p class="mt-1 max-w-3xl text-app-body text-app-text-secondary">
        {{ subtitle() }}
      </p>
    </div>

    @if (actionLabel()) {
      <div
        class="flex shrink-0 items-center justify-start md:justify-end"
        data-testid="page-actions"
      >
        <liass-button
          size="md"
          tone="brand"
          variant="solid"
          [icon]="actionIcon()"
          (pressed)="emitAction()"
        >
          {{ actionLabel() }}
        </liass-button>
      </div>
    }
  </div>
</header>
