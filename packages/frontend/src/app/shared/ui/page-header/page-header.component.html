<header class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
  <div class="min-w-0">
    <p class="text-xs font-semibold uppercase tracking-[0.18em] text-emerald-700 dark:text-emerald-300">
      {{ eyebrow() }}
    </p>
    <h1 class="mt-2 text-2xl font-semibold leading-tight text-slate-950 dark:text-white md:text-3xl">
      {{ title() }}
    </h1>
    <p class="mt-2 max-w-3xl text-sm leading-6 text-slate-600 dark:text-slate-400">
      {{ subtitle() }}
    </p>
  </div>

  @if (actionLabel()) {
    <button
      class="inline-flex h-11 items-center justify-center gap-2 rounded-lg bg-emerald-700 px-4 text-sm font-semibold text-white shadow-sm shadow-emerald-900/10 transition hover:bg-emerald-800 focus:outline-none focus:ring-4 focus:ring-emerald-700/15"
      type="button"
      (click)="emitAction()"
    >
      @if (actionIcon()) {
        <mat-icon>{{ actionIcon() }}</mat-icon>
      }
      <span>{{ actionLabel() }}</span>
    </button>
  }
</header>
