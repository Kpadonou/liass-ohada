<header class="border-b border-app-border/75 pb-3">
  <div class="flex flex-col gap-2.5 md:flex-row md:items-start md:justify-between">
    <div class="min-w-0">
      <nav class="flex min-w-0 items-center gap-1.5 text-xs font-medium text-app-text-secondary" aria-label="Breadcrumb">
        <mat-icon class="text-base text-brand-700 dark:text-brand-300" aria-hidden="true">home</mat-icon>
        <mat-icon class="text-base text-slate-400" aria-hidden="true">chevron_right</mat-icon>
        <span class="min-w-0 truncate">{{ eyebrow() }}</span>
        <mat-icon class="text-base text-slate-300 dark:text-slate-600" aria-hidden="true">chevron_right</mat-icon>
        <span class="min-w-0 truncate font-semibold text-brand-700 dark:text-brand-300">{{ title() }}</span>
      </nav>
      <h1 class="mt-1.5 text-lg font-semibold leading-tight text-app-text md:text-app-page-title">
        {{ title() }}
      </h1>
      <p class="mt-1 max-w-3xl text-app-body text-app-text-secondary">
        {{ subtitle() }}
      </p>
    </div>

    @if (actionLabel()) {
      <div class="flex shrink-0 items-center justify-start md:justify-end" data-testid="page-actions">
        <liass-button
          size="md"
          tone="brand"
          variant="solid"
          [icon]="actionIcon()"
          (pressed)="emitAction()"
        >
          {{ actionLabel() }}
        </liass-button>
      </div>
    }
  </div>
</header>
