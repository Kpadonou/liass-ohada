<button
  mat-icon-button
  type="button"
  class="!h-11 !w-11 rounded-app-control border border-white/15 bg-white/[0.06] text-white transition hover:bg-white/[0.1]"
  [matMenuTriggerFor]="fontMenu"
  [matTooltip]="'FONT_PREVIEW.TOGGLE' | transloco"
  [attr.aria-label]="'FONT_PREVIEW.TOGGLE' | transloco"
>
  <span aria-hidden="true" class="font-sans text-sm font-bold leading-none tracking-tight">Aa</span>
</button>

<mat-menu #fontMenu="matMenu">
  <button
    mat-menu-item
    type="button"
    role="menuitemradio"
    [attr.aria-checked]="uiStore.fontFamily() === 'inter'"
    (click)="selectFontFamily('inter')"
  >
    <mat-icon aria-hidden="true" [class.invisible]="uiStore.fontFamily() !== 'inter'">
      check
    </mat-icon>
    <span>Inter</span>
  </button>
  <button
    mat-menu-item
    type="button"
    role="menuitemradio"
    [attr.aria-checked]="uiStore.fontFamily() === 'plus-jakarta-sans'"
    (click)="selectFontFamily('plus-jakarta-sans')"
  >
    <mat-icon aria-hidden="true" [class.invisible]="uiStore.fontFamily() !== 'plus-jakarta-sans'">
      check
    </mat-icon>
    <span>Plus Jakarta Sans</span>
  </button>
</mat-menu>
