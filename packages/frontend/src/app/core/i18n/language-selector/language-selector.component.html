<button
  class="h-8 rounded-md border border-app-border bg-app-surface/70 px-2 py-0.5 text-xs font-semibold uppercase text-app-text-secondary transition-all hover:bg-app-surface-hover"
  data-testid="language-trigger"
  matButton
  type="button"
  [matMenuTriggerFor]="languageMenu"
  [attr.aria-label]="'COMMON.LANGUAGE_SELECTOR.TRIGGER' | transloco"
>
  {{ activeLanguage().toUpperCase() }}
</button>

<mat-menu #languageMenu="matMenu" xPosition="before">
  @for (language of languages; track language.code) {
    <button
      mat-menu-item
      type="button"
      [class.!bg-app-surface-selected]="isActiveLanguage(language.code)"
      [attr.aria-current]="isActiveLanguage(language.code) ? 'true' : null"
      (click)="switchLanguage(language.code)"
    >
      <mat-icon [class.opacity-0]="!isActiveLanguage(language.code)">check</mat-icon>
      @if (isActiveLanguage(language.code)) {
        <span class="sr-only">{{ 'COMMON.LANGUAGE_SELECTOR.CURRENT' | transloco }}</span>
      }
      <span>{{ language.labelKey | transloco }}</span>
    </button>
  }
</mat-menu>
