<div class="space-y-4">
  @if (availability() === 'AVAILABLE') {
    <router-outlet />
  } @else if (availability() === 'UNKNOWN') {
    <liass-card>
      <div class="space-y-3" role="status" aria-busy="true">
        <p class="text-sm text-app-text-secondary">
          {{ 'RESTAURANTS.ACCESS.CHECKING' | transloco }}
        </p>
        <liass-skeleton variant="block" />
      </div>
    </liass-card>
  } @else {
    <liass-card
      ><p role="alert">{{ 'RESTAURANTS.ACCESS.DENIED' | transloco }}</p></liass-card
    >
  }
</div>
