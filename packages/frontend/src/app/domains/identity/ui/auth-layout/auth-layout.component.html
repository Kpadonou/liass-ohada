<main class="liass-auth-shell min-h-dvh text-slate-950">
  <div class="liass-auth-background" aria-hidden="true">
    <span class="liass-auth-grid"></span>
    <span class="liass-auth-glow liass-auth-glow-left"></span>
    <span class="liass-auth-glow liass-auth-glow-right"></span>
    <span class="liass-auth-arc liass-auth-arc-one"></span>
    <span class="liass-auth-arc liass-auth-arc-two"></span>
  </div>

  <div class="relative z-10 flex min-h-dvh flex-col px-4 py-4 sm:px-6 sm:py-5 lg:px-8">
    <header class="liass-auth-topbar flex w-full items-center justify-between gap-4">
      <a
        data-testid="auth-public-return"
        [href]="publicSiteUrl"
        class="liass-auth-return-link liass-focus-ring inline-flex min-w-0 items-center gap-2 rounded-app-control text-sm font-semibold text-brand-700"
      >
        <mat-icon aria-hidden="true">arrow_back</mat-icon>
        <span>{{ 'IDENTITY.AUTH_LAYOUT.BACK_TO_PUBLIC_SITE' | transloco }}</span>
      </a>
      <liass-language-selector />
    </header>

    <section class="flex flex-1 items-center justify-center py-6 sm:py-8">
      <div class="liass-auth-frame w-full max-w-[32rem]">
        <div class="liass-auth-brand-surface">
          <liass-logo
            size="md"
            theme="light"
            variant="horizontal"
            [alt]="'IDENTITY.AUTH_LAYOUT.LOGO_ALT' | transloco"
          />
        </div>

        <div class="liass-auth-card">
          <ng-content />
        </div>

        <footer class="liass-auth-reassurance" [attr.aria-label]="'IDENTITY.AUTH_LAYOUT.REASSURANCE.LABEL' | transloco">
          <div>
            <mat-icon aria-hidden="true">verified_user</mat-icon>
            <span>{{ 'IDENTITY.AUTH_LAYOUT.REASSURANCE.SECURE' | transloco }}</span>
          </div>
          <div>
            <mat-icon aria-hidden="true">domain</mat-icon>
            <span>{{ 'IDENTITY.AUTH_LAYOUT.REASSURANCE.ISOLATION' | transloco }}</span>
          </div>
          <div>
            <mat-icon aria-hidden="true">public</mat-icon>
            <span>{{ 'IDENTITY.AUTH_LAYOUT.REASSURANCE.OHADA' | transloco }}</span>
          </div>
        </footer>
      </div>
    </section>
  </div>
</main>
