<liass-auth-layout>
  <div class="mb-5 sm:mb-8">
    <h1 class="text-3xl font-semibold leading-tight text-slate-800 dark:text-white/90 sm:text-4xl">
      {{ 'IDENTITY.SIGNUP.TITLE' | transloco }}
    </h1>
    <p class="mt-2 text-sm leading-6 text-slate-500 dark:text-slate-400">
      {{ 'IDENTITY.SIGNUP.SUBTITLE' | transloco }}
    </p>
  </div>

  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-5">
    <button
      class="inline-flex items-center justify-center gap-3 rounded-lg bg-slate-100 px-5 py-3 text-sm font-normal text-slate-500 transition dark:bg-white/5 dark:text-white/50"
      type="button"
      disabled
      aria-describedby="signup-disabled-note"
    >
      <svg class="size-5" viewBox="0 0 20 20" aria-hidden="true">
        <path
          fill="#4285F4"
          d="M18.75 10.19c0-.72-.06-1.24-.19-1.78h-8.38v3.24h4.92c-.1.81-.64 2.03-1.83 2.84l-.02.11 2.65 2.01.19.02c1.68-1.53 2.66-3.77 2.66-6.44z"
        />
        <path
          fill="#34A853"
          d="M10.18 18.75c2.41 0 4.43-.78 5.91-2.12l-2.82-2.14c-.75.52-1.76.88-3.09.88-2.36 0-4.36-1.53-5.08-3.64l-.1.01-2.76 2.09-.04.1c1.47 2.86 4.49 4.82 7.98 4.82z"
        />
        <path
          fill="#FBBC05"
          d="M5.1 11.73A5.47 5.47 0 0 1 4.8 10c0-.6.11-1.19.29-1.73v-.12L2.29 6.03l-.09.04A8.6 8.6 0 0 0 1.25 10c0 1.41.35 2.74.95 3.93l2.9-2.2z"
        />
        <path
          fill="#EB4335"
          d="M10.18 4.63c1.68 0 2.81.71 3.45 1.31l2.52-2.42C14.6 2.12 12.59 1.25 10.18 1.25c-3.49 0-6.51 1.96-7.98 4.82l2.89 2.2c.72-2.11 2.73-3.64 5.09-3.64z"
        />
      </svg>
      <span>{{ 'IDENTITY.AUTH_SOCIAL.GOOGLE' | transloco }}</span>
    </button>
    <button
      class="inline-flex items-center justify-center gap-3 rounded-lg bg-slate-100 px-5 py-3 text-sm font-normal text-slate-500 transition dark:bg-white/5 dark:text-white/50"
      type="button"
      disabled
      aria-describedby="signup-disabled-note"
    >
      <span class="grid size-5 place-items-center rounded bg-[#0A66C2] text-xs font-bold text-white" aria-hidden="true">in</span>
      <span>{{ 'IDENTITY.AUTH_SOCIAL.LINKEDIN' | transloco }}</span>
    </button>
  </div>

  <div class="relative py-4 sm:py-6">
    <div class="absolute inset-0 flex items-center" aria-hidden="true">
      <div class="w-full border-t border-slate-200 dark:border-slate-800"></div>
    </div>
    <div class="relative flex justify-center text-sm">
      <span class="bg-white px-4 py-1 text-slate-400 dark:bg-slate-950">
        {{ 'IDENTITY.AUTH_SOCIAL.DIVIDER' | transloco }}
      </span>
    </div>
  </div>

  <form class="space-y-5" aria-describedby="signup-disabled-note" (submit)="$event.preventDefault()">
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
      <div>
        <label class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300" for="signup-first-name">
          {{ 'IDENTITY.SIGNUP.FIELDS.FIRST_NAME' | transloco }}
          <span class="text-danger-600">*</span>
        </label>
        <input
          id="signup-first-name"
          class="liass-focus-ring h-11 w-full rounded-lg border border-slate-200 bg-white px-4 text-sm text-slate-900 shadow-app-xs outline-none transition placeholder:text-slate-400 disabled:bg-slate-50 disabled:text-slate-400 dark:border-slate-800 dark:bg-slate-950 dark:text-white dark:placeholder:text-slate-500 dark:disabled:bg-white/5"
          type="text"
          autocomplete="given-name"
          [placeholder]="'IDENTITY.SIGNUP.PLACEHOLDERS.FIRST_NAME' | transloco"
        />
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300" for="signup-last-name">
          {{ 'IDENTITY.SIGNUP.FIELDS.LAST_NAME' | transloco }}
          <span class="text-danger-600">*</span>
        </label>
        <input
          id="signup-last-name"
          class="liass-focus-ring h-11 w-full rounded-lg border border-slate-200 bg-white px-4 text-sm text-slate-900 shadow-app-xs outline-none transition placeholder:text-slate-400 disabled:bg-slate-50 disabled:text-slate-400 dark:border-slate-800 dark:bg-slate-950 dark:text-white dark:placeholder:text-slate-500 dark:disabled:bg-white/5"
          type="text"
          autocomplete="family-name"
          [placeholder]="'IDENTITY.SIGNUP.PLACEHOLDERS.LAST_NAME' | transloco"
        />
      </div>
    </div>

    <div>
      <label class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300" for="signup-email">
        {{ 'IDENTITY.SIGNUP.FIELDS.EMAIL' | transloco }}
        <span class="text-danger-600">*</span>
      </label>
      <input
        id="signup-email"
        class="liass-focus-ring h-11 w-full rounded-lg border border-slate-200 bg-white px-4 text-sm text-slate-900 shadow-app-xs outline-none transition placeholder:text-slate-400 disabled:bg-slate-50 disabled:text-slate-400 dark:border-slate-800 dark:bg-slate-950 dark:text-white dark:placeholder:text-slate-500 dark:disabled:bg-white/5"
        type="email"
        autocomplete="email"
        [placeholder]="'IDENTITY.SIGNUP.PLACEHOLDERS.EMAIL' | transloco"
      />
    </div>

    <div>
      <label class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300" for="signup-password">
        {{ 'IDENTITY.SIGNUP.FIELDS.PASSWORD' | transloco }}
        <span class="text-danger-600">*</span>
      </label>
      <input
        id="signup-password"
        class="liass-focus-ring h-11 w-full rounded-lg border border-slate-200 bg-white px-4 text-sm text-slate-900 shadow-app-xs outline-none transition placeholder:text-slate-400 disabled:bg-slate-50 disabled:text-slate-400 dark:border-slate-800 dark:bg-slate-950 dark:text-white dark:placeholder:text-slate-500 dark:disabled:bg-white/5"
        type="password"
        autocomplete="new-password"
        [placeholder]="'IDENTITY.SIGNUP.PLACEHOLDERS.PASSWORD' | transloco"
      />
    </div>

    <div class="flex items-start gap-3">
      <input
        id="signup-terms"
        class="liass-focus-ring mt-0.5 size-5 rounded border-slate-300 text-brand-700 disabled:opacity-60 dark:border-slate-700"
        type="checkbox"
      />
      <label class="text-sm leading-6 text-slate-500 dark:text-slate-400" for="signup-terms">
        {{ 'IDENTITY.SIGNUP.TERMS' | transloco }}
      </label>
    </div>

    <p
      id="signup-disabled-note"
      class="rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm leading-6 text-amber-800 dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-200"
    >
      {{ 'IDENTITY.SIGNUP.DISABLED_NOTICE' | transloco }}
    </p>

    <button
      class="flex h-11 w-full items-center justify-center rounded-lg bg-brand-700 px-4 text-sm font-medium text-white opacity-60 shadow-app-xs"
      type="submit"
      disabled
    >
      {{ 'IDENTITY.SIGNUP.ACTIONS.SIGN_UP' | transloco }}
    </button>
  </form>

  <p class="mt-5 text-center text-sm font-normal text-slate-700 dark:text-slate-400 sm:text-left">
    {{ 'IDENTITY.SIGNUP.HAVE_ACCOUNT' | transloco }}
    <a routerLink="/login" class="liass-focus-ring rounded-app-sm text-brand-700 hover:text-brand-600 dark:text-brand-300">
      {{ 'IDENTITY.SIGNUP.ACTIONS.SIGN_IN' | transloco }}
    </a>
  </p>
</liass-auth-layout>
