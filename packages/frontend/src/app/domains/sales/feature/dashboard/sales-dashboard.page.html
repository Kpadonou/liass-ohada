<div class="mx-auto w-full max-w-[var(--spacing-app-settings)] space-y-5 md:space-y-6">
  <liass-page-header
    [eyebrow]="'SHELL.NAV.SALES' | transloco"
    [title]="'SALES.DASHBOARD.TITLE' | transloco"
    [subtitle]="'SALES.DASHBOARD.DESCRIPTION' | transloco"
  />
  <div class="grid gap-4 md:grid-cols-3">
    @for (shortcut of shortcuts; track shortcut.route) {
      <a
        [routerLink]="shortcut.route"
        class="liass-focus-ring group block rounded-app-card"
        [attr.aria-label]="shortcut.labelKey | transloco"
      >
        <liass-card>
          <div class="flex items-center gap-3">
            <mat-icon class="text-brand-700 dark:text-brand-300" aria-hidden="true">{{
              shortcut.icon
            }}</mat-icon>
            <h2 class="min-w-0 flex-1 text-base font-semibold text-app-text-primary">
              {{ shortcut.labelKey | transloco }}
            </h2>
            <mat-icon class="text-app-text-secondary group-hover:text-brand-700" aria-hidden="true"
              >chevron_right</mat-icon
            >
          </div>
          <p class="mt-3 text-sm leading-6 text-app-text-secondary">
            {{ shortcut.descriptionKey | transloco }}
          </p>
        </liass-card>
      </a>
    }
  </div>
</div>
