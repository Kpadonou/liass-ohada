<main class="grid min-h-dvh place-items-center bg-slate-50 px-5 py-10 text-slate-950">
  <section class="w-full max-w-sm rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <div class="mb-6">
      <p class="text-sm font-medium uppercase text-emerald-700">Liass-OHADA</p>
      <h1 class="mt-2 text-2xl font-semibold">Sign in</h1>
    </div>

    <form class="grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" autocomplete="email" formControlName="email" />
        <mat-icon matPrefix>mail</mat-icon>
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <mat-error>Enter a valid email.</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          autocomplete="current-password"
          formControlName="password"
        />
        <mat-icon matPrefix>lock</mat-icon>
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <mat-error>Enter your password.</mat-error>
        }
      </mat-form-field>

      @if (authStore.error()) {
        <p class="rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
          {{ authStore.error() }}
        </p>
      }

      <button matButton="filled" type="submit" [disabled]="authStore.loading()">
        <mat-icon>login</mat-icon>
        Sign in
      </button>
    </form>
  </section>
</main>
