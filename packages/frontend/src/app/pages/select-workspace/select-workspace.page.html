<main class="grid min-h-dvh place-items-center bg-slate-50 px-5 py-10 text-slate-950">
  <section class="w-full max-w-md rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <div class="mb-6 flex items-start justify-between gap-4">
      <div>
        <p class="text-sm font-medium uppercase text-emerald-700">Workspace</p>
        <h1 class="mt-2 text-2xl font-semibold">Select tenant</h1>
      </div>
      <button matIconButton type="button" aria-label="Sign out" (click)="logout()">
        <mat-icon>logout</mat-icon>
      </button>
    </div>

    <form class="grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Organization ID</mat-label>
        <input matInput autocomplete="organization" formControlName="orgId" />
        <mat-icon matPrefix>business</mat-icon>
        @if (form.controls.orgId.touched && form.controls.orgId.invalid) {
          <mat-error>Enter an organization ID.</mat-error>
        }
      </mat-form-field>

      <button matButton="filled" type="submit">
        <mat-icon>domain_verification</mat-icon>
        Continue
      </button>
    </form>
  </section>
</main>
